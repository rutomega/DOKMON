<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | DOKMON</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm">
      <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">
        Login Karyawan
      </h2>

      <form onsubmit="return handleLogin()" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-600"
            >Email</label
          >
          <input
            type="email"
            id="email"
            required
            class="mt-1 w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-600"
            >Password</label
          >
          <input
            type="password"
            id="password"
            required
            class="mt-1 w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-2 rounded-xl hover:bg-blue-700 transition duration-300"
        >
          Login
        </button>
      </form>
    </div>

    <script>
      function handleLogin() {
        // Di sini kamu bisa isi validasi palsu / hardcoded user
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        // Simulasi: hanya izinkan jika email dan password cocok
        if (email === "admin@dokmon.com" && password === "admin123") {
          window.location.href = "dashboard.html";
        } else {
          alert("Login gagal. Coba lagi.");
        }

        return false; // Cegah form dari reload halaman
      }
    </script>
  </body>
</html>
